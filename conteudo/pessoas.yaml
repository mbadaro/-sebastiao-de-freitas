- id: raposo-tavares
  nome: Antônio Raposo Tavares
  vinculo: notavel
  ligacao_notavel:
    tipo: convivencia
    descricao: Bandeirante, nascido em Beja por volta de 1598. Sebastião esteve na bandeira do Guairá, de 1628, que Raposo Tavares organizou. Mais tarde, duas bisnetas de Sebastião se casaram com filhos do capitão Diogo da Costa Tavares, apontado como meio-irmão de Raposo Tavares (parentesco ainda sem fonte localizada).
